<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Track Watch">
<title>Track Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070d18;--surface:rgba(255,255,255,.045);--border:rgba(79,172,254,.15);
  --accent:#4facfe;--danger:#ff5252;--green:#43e97b;--yellow:#ffd700;
  --text:#e8f0fe;--muted:rgba(255,255,255,.35);
}
html,body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior:none;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseOut{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.8);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes dangerPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,82,82,0)}60%{box-shadow:0 0 0 14px rgba(255,82,82,.1)}}
@keyframes redFlash{0%,100%{background:rgba(255,82,82,.08)}50%{background:rgba(255,82,82,.22)}}
@keyframes checkPop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes countBar{from{width:100%}to{width:0%}}

/* ── Layout ── */
#app{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  transition:background .6s ease;padding-bottom:90px}
.screen{animation:fadeIn .3s ease}

/* ── Buttons ── */
.pill{display:flex;align-items:center;justify-content:center;gap:6px;border:none;
  border-radius:50px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;
  transition:all .18s ease;-webkit-tap-highlight-color:transparent;user-select:none;
  font-size:14px;padding:14px 20px;width:100%}
.pill:active{transform:scale(.95)}
.pill-sm{padding:8px 16px;font-size:12px;width:auto}
.chip{border:none;border-radius:50px;cursor:pointer;font-family:'Nunito',sans-serif;
  font-weight:700;font-size:12px;padding:7px 14px;transition:all .18s;
  -webkit-tap-highlight-color:transparent}
.chip:active{transform:scale(.93)}

/* ── Cards ── */
.card{border-radius:20px;padding:15px 17px;background:var(--surface);border:1px solid var(--border)}
.label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin-bottom:10px;text-transform:uppercase}

/* ── Tabs ── */
#tab-bar{display:flex;gap:4px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
#tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:9px 13px;font-size:11px;border:none;border-radius:50px;
  cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;display:flex;gap:5px;
  align-items:center;background:var(--surface);color:var(--muted);transition:all .18s;
  -webkit-tap-highlight-color:transparent}
.tab-btn.active{background:var(--accent);color:#fff}
.tab-btn:active{transform:scale(.94)}

/* ── Spinner ── */
.spin{width:18px;height:18px;border:2.5px solid rgba(79,172,254,.2);border-top-color:#4facfe;
  border-radius:50%;animation:spin .75s linear infinite;display:inline-block;flex-shrink:0}

/* ── Train cards ── */
.train-card{border-radius:20px;padding:13px 15px;display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1.5px solid var(--border);animation:fadeUp .25s ease}
.train-dot{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.dir-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:50px;
  background:rgba(255,255,255,.07);color:rgba(255,255,255,.55)}
.from-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:50px;
  background:rgba(79,172,254,.1);color:rgba(79,172,254,.9)}

/* ── Progress bar ── */
.prog-track{height:4px;border-radius:50px;background:rgba(255,255,255,.07);overflow:hidden}
.prog-fill{height:100%;border-radius:50px;transition:width .6s ease}

/* ── Dead man's switch ── */
#dms-bar{height:5px;border-radius:50px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
#dms-fill{height:100%;border-radius:50px;background:var(--accent);transition:width 1s linear}

/* ── Inputs ── */
input,textarea{font-family:'Nunito',sans-serif;outline:none;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:12px;padding:10px 13px;color:#fff;font-size:13px;width:100%}
textarea{resize:none;line-height:1.5}

/* ── Misc ── */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
.note-card{border-radius:18px;padding:12px 15px;display:flex;gap:11px;
  background:var(--surface);animation:fadeUp .25s ease}
.crew-row{border-radius:14px;padding:10px 13px;display:flex;align-items:center;gap:11px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.event-row{display:flex;gap:9px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.event-row:last-child{border-bottom:none}
#bottom-cta{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;
  max-width:440px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(7,13,24,.98) 65%,transparent);z-index:100}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ════════════════════════════════════════════════════════
   TRACK WATCH — Standalone PWA
   Open in Safari → Share → Add to Home Screen for full GPS + notifications
════════════════════════════════════════════════════════ */

/* ─── Constants ─────────────────────────────────────────────────────────── */
const LC={
  "1":"#EE352E","2":"#EE352E","3":"#EE352E","4":"#00933C","5":"#00933C","6":"#00933C",
  "7":"#B933AD","A":"#0039A6","C":"#0039A6","E":"#0039A6","B":"#FF6319","D":"#FF6319",
  "F":"#FF6319","M":"#FF6319","G":"#6CBE45","J":"#996633","Z":"#996633","L":"#A7A9AC",
  "N":"#FCCC0A","Q":"#FCCC0A","R":"#FCCC0A","W":"#FCCC0A","S":"#808183","FS":"#808183",
  "H":"#808183","SI":"#0039A6"
};
const ALL_LINES=["1","2","3","4","5","6","7","A","C","E","B","D","F","M","G","J","Z","L","N","Q","R","W","S","H","FS","SI"];
const ADIST=[50,100,200,500];
const ATIME=[15,30,60,120];
const NYC={lat:40.7549,lon:-73.984};

/* ─── State ──────────────────────────────────────────────────────────────── */
const S={
  screen:"legal",        // legal | app
  tab:"radar",
  loc:null,              // {lat,lon,acc}
  locStatus:"idle",      // idle|requesting|granted|denied
  trains:[],
  alerts:[],
  tracking:false,
  notifOK:false,
  log:[],
  fetching:false,
  liveMode:true,
  lastFetch:null,
  alertDist:200,
  alertTime:30,
  legalScrolled:false,
  legalChecked:false,
  danger:false,
  // DMS
  dmsArmed:false,
  dmsCountdown:30,
  dmsInterval:30,
  dmsTriggered:false,
  // Crew
  crew:[],
  crewChecked:{},
  // Notes
  notes:JSON.parse(localStorage.getItem("tw_notes")||"[]"),
  // AI
  aiMessages:[{role:"assistant",content:"Hey — I'm your Track Watch AI. I know your real-time location and nearby train activity. Ask me anything: route planning, safety windows, gear, or what you're planning tonight."}],
  aiLoading:false,
};

let watchId=null,tickId=null,dmsTickId=null;
const alertedSet=new Set();
const canvas=document.createElement("canvas");
let rafId=null;
const sweep={v:0};

/* ─── Helpers ────────────────────────────────────────────────────────────── */
function hav(la1,lo1,la2,lo2){
  const R=6371000,dL=(la2-la1)*Math.PI/180,dO=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dO/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function bearingTo(la1,lo1,la2,lo2){
  const dL=(lo2-lo1)*Math.PI/180,a1=la1*Math.PI/180,a2=la2*Math.PI/180;
  return((Math.atan2(Math.sin(dL)*Math.cos(a2),Math.cos(a1)*Math.sin(a2)-Math.sin(a1)*Math.cos(a2)*Math.cos(dL))*180/Math.PI)+360)%360;
}
function cardinal(deg){
  if(deg==null)return"";
  const d=["↑N","↗NE","→E","↘SE","↓S","↙SW","←W","↖NW"];
  return d[Math.round(deg/45)%8];
}
function trainHeading(t){
  if(t.direction==="N")return"↑ Northbound";
  if(t.direction==="S")return"↓ Southbound";
  if(t.bearing!=null){
    const b=((t.bearing%360)+360)%360;
    if(b>315||b<=45)return"↑ Northbound";
    if(b>45&&b<=135)return"→ Eastbound";
    if(b>135&&b<=225)return"↓ Southbound";
    return"← Westbound";
  }
  return"";
}
function el(id){return document.getElementById(id)}
function ce(tag,attrs={},children=[]){
  const e=document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style")Object.assign(e.style,v);
    else if(k==="class")e.className=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  });
  children.forEach(c=>{
    if(typeof c==="string")e.appendChild(document.createTextNode(c));
    else if(c)e.appendChild(c);
  });
  return e;
}
function addLog(msg,type="info"){
  S.log.unshift({msg,type,time:new Date().toLocaleTimeString()});
  S.log=S.log.slice(0,50);
}

/* ─── Simulation ─────────────────────────────────────────────────────────── */
function simTrains(){
  const u=S.loc||NYC;
  return ALL_LINES.map((line,i)=>{
    const angle=(i/ALL_LINES.length)*2*Math.PI+Date.now()/70000+i*0.45;
    const radius=180+Math.abs(Math.sin(Date.now()/5500+i*1.9))*620;
    const lat=u.lat+(Math.cos(angle)*radius)/111320;
    const lon=u.lon+(Math.sin(angle)*radius)/(111320*Math.cos(u.lat*Math.PI/180));
    const speed=10+Math.abs(Math.sin(i*2.3+Date.now()/30000))*18;
    const bearing=((angle*180/Math.PI)+90)%360;
    const dir=bearing>315||bearing<=45?"N":bearing>135&&bearing<=225?"S":bearing>45&&bearing<=135?"E":"W";
    const dist=hav(u.lat,u.lon,lat,lon);
    return{id:`sim-${line}-${i}`,line,lat,lon,bearing,speed,
      distanceToUser:dist,eta:Math.round(dist/Math.max(speed,1)),
      direction:dir,simulated:true,
      bearingFromUser:bearingTo(u.lat,u.lon,lat,lon)};
  });
}

/* ─── MTA Live fetch via Claude ──────────────────────────────────────────── */
const MTA_FEEDS=[
  "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct/gtfs",
  "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct/gtfs-ace",
  "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct/gtfs-bdfm",
  "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct/gtfs-g",
  "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct/gtfs-jz",
  "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct/gtfs-nqrw",
  "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct/gtfs-l",
  "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct/gtfs-si",
];
async function fetchLive(){
  const u=S.loc||NYC;
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514",max_tokens:8000,
      tools:[{type:"web_search_20250305",name:"web_search"}],
      messages:[{role:"user",content:
        `Fetch these public MTA NYC GTFS-RT feeds (no auth needed) and extract all VehiclePosition entities with real GPS.\nFeeds:\n${MTA_FEEDS.join("\n")}\nReturn ONLY JSON array, no markdown. Each: {"id":"str","line":"str","lat":num,"lon":num,"bearing":num|null,"speed":num|null,"direction":"N"|"S"|null}\nOnly where lat 40.4-41.0, lon -74.4 to -73.5.`}]
    })
  });
  if(!res.ok)throw new Error(res.status);
  const data=await res.json();
  const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
  const s=text.indexOf("["),e=text.lastIndexOf("]");
  if(s<0||e<0)return[];
  return JSON.parse(text.slice(s,e+1))
    .filter(t=>t.lat&&t.lon&&t.lat>40.4&&t.lat<41&&t.lon>-74.4&&t.lon<-73.5)
    .map(t=>({...t,
      distanceToUser:hav(u.lat,u.lon,t.lat,t.lon),
      bearingFromUser:bearingTo(u.lat,u.lon,t.lat,t.lon),
      get eta(){return Math.round(this.distanceToUser/Math.max(this.speed||12,1))},
      simulated:false}));
}

/* ─── Process trains ─────────────────────────────────────────────────────── */
function processTrains(trains){
  S.trains=trains;
  const a=trains.filter(t=>t.distanceToUser<=S.alertDist||t.eta<=S.alertTime);
  S.alerts=a;
  S.danger=a.length>0;
  a.forEach(t=>{
    const key=t.id+Math.floor(Date.now()/8000);
    if(!alertedSet.has(key)){
      alertedSet.add(key);
      fireNotif(t);
      addLog(`🚨 Line ${t.line} — ${Math.round(t.distanceToUser)}m, ETA ${t.eta}s, ${trainHeading(t)}`,"danger");
    }
  });
  render();
}

/* ─── Notifications ──────────────────────────────────────────────────────── */
function fireNotif(t){
  if(S.notifOK&&"Notification"in window)
    new Notification(`⚠️ Line ${t.line} — ${Math.round(t.distanceToUser)}m`,
      {body:`ETA ${t.eta}s · ${trainHeading(t)}`,tag:t.id,requireInteraction:true});
  if("vibrate"in navigator)navigator.vibrate([200,80,200,80,500]);
}
async function requestNotif(){
  if(!("Notification"in window))return;
  const p=await Notification.requestPermission();
  S.notifOK=p==="granted";
  addLog(p==="granted"?"Notifications on ✓":"Notifications denied",p==="granted"?"success":"warn");
  render();
}

/* ─── GPS ────────────────────────────────────────────────────────────────── */
function requestLocation(){
  S.locStatus="requesting";
  render();
  if(!navigator.geolocation){S.locStatus="denied";render();return;}
  navigator.geolocation.getCurrentPosition(
    p=>{S.loc={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};S.locStatus="granted";render();},
    ()=>{S.locStatus="denied";render();},
    {enableHighAccuracy:true,timeout:12000,maximumAge:0}
  );
}
function startGPSWatch(){
  if(!navigator.geolocation)return;
  watchId=navigator.geolocation.watchPosition(
    p=>{S.loc={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};S.locStatus="granted";},
    e=>addLog(e.message,"warn"),
    {enableHighAccuracy:true,maximumAge:1000,timeout:10000}
  );
}

/* ─── Tracking loop ──────────────────────────────────────────────────────── */
function startTracking(){
  S.tracking=true;startGPSWatch();addLog("Tracking started","success");
  const tick=async()=>{
    if(S.liveMode){
      S.fetching=true;render();
      try{
        const t=await fetchLive();
        if(t.length>0){S.lastFetch=new Date();S.fetching=false;addLog(`✅ Live: ${t.length} trains`,"success");processTrains(t);return;}
        addLog("0 live positions — simulation","warn");S.liveMode=false;
      }catch{addLog("Live failed — simulation","warn");S.liveMode=false;}
      S.fetching=false;
    }
    processTrains(simTrains());
  };
  tick();
  tickId=setInterval(tick,S.liveMode?30000:2000);
  render();
}
function stopTracking(){
  if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  if(tickId!=null){clearInterval(tickId);tickId=null;}
  S.tracking=false;S.alerts=[];S.danger=false;
  addLog("Tracking stopped","warn");render();
}

/* ─── Dead Man's Switch ──────────────────────────────────────────────────── */
function armDMS(){
  S.dmsArmed=true;S.dmsCountdown=S.dmsInterval;S.dmsTriggered=false;
  dmsTickId=setInterval(()=>{
    S.dmsCountdown--;
    if(S.dmsCountdown<=0){
      S.dmsTriggered=true;S.dmsCountdown=S.dmsInterval;
      if("vibrate"in navigator)navigator.vibrate([500,200,500,200,1000]);
      if(S.notifOK&&"Notification"in window)new Notification("☠️ CHECK-IN OVERDUE",{body:"Are you OK? Check in now.",requireInteraction:true});
      addLog("☠️ DMS fired — check-in overdue","danger");
    }
    const fill=el("dms-fill");if(fill)fill.style.width=(S.dmsCountdown/S.dmsInterval*100)+"%";
    const cnt=el("dms-count");if(cnt){cnt.textContent=S.dmsCountdown+"s";cnt.style.color=S.dmsCountdown<=10?"#ff5252":"#fff";}
    const trig=el("dms-triggered");
    if(trig)trig.style.display=S.dmsTriggered?"flex":"none";
  },1000);
  render();
}
function disarmDMS(){
  clearInterval(dmsTickId);dmsTickId=null;
  S.dmsArmed=false;S.dmsCountdown=S.dmsInterval;S.dmsTriggered=false;render();
}
function dmsCheckIn(){S.dmsCountdown=S.dmsInterval;S.dmsTriggered=false;addLog("✓ DMS check-in","success");}

/* ─── Sim loop for idle state ────────────────────────────────────────────── */
let idleSimId=null;
function startIdleSim(){
  if(idleSimId)return;
  processTrains(simTrains());
  idleSimId=setInterval(()=>{if(!S.tracking)processTrains(simTrains());},2000);
}

/* ─── Canvas Radar ───────────────────────────────────────────────────────── */
function drawRadar(){
  if(S.tab!=="radar"){cancelAnimationFrame(rafId);rafId=null;return;}
  const c=canvas;
  const W=c.width,H=c.height,cx=W/2,cy=H/2;
  const ctx=c.getContext("2d");
  const u=S.loc||NYC;
  const trains=S.trains;
  const maxDist=Math.max(...trains.map(t=>t.distanceToUser),S.alertDist*2,300);
  const scale=(Math.min(W,H)/2-14)/maxDist;
  const danger=S.danger;

  ctx.clearRect(0,0,W,H);
  // BG
  const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,W/2);
  bg.addColorStop(0,danger?"rgba(28,4,4,.98)":"rgba(6,14,30,.98)");
  bg.addColorStop(1,danger?"rgba(12,2,2,1)":"rgba(3,8,20,1)");
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(cx,cy,W/2,0,Math.PI*2);ctx.fill();

  // Rings
  [.25,.5,.75,1].forEach(f=>{
    const r=f*(Math.min(W,H)/2-14);
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle=danger?"rgba(255,60,60,.12)":"rgba(79,172,254,.1)";
    ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle=danger?"rgba(255,110,110,.3)":"rgba(110,170,255,.3)";
    ctx.font="9px Nunito,sans-serif";ctx.textAlign="left";ctx.textBaseline="middle";
    ctx.fillText(Math.round(maxDist*f)+"m",cx+r+3,cy-3);
  });

  // Compass
  ctx.fillStyle="rgba(255,255,255,.2)";ctx.font="bold 9px Nunito,sans-serif";ctx.textAlign="center";
  const edge=Math.min(W,H)/2-6;
  ctx.fillText("N",cx,cy-edge+12);ctx.fillText("S",cx,cy+edge-4);
  ctx.fillText("E",cx+edge-4,cy+4);ctx.fillText("W",cx-edge+4,cy+4);

  // Alert ring
  const ar=S.alertDist*scale;
  if(ar<Math.min(W,H)/2){
    ctx.beginPath();ctx.arc(cx,cy,ar,0,Math.PI*2);
    ctx.strokeStyle=danger?"rgba(255,82,82,.6)":"rgba(255,210,50,.5)";
    ctx.lineWidth=1.5;ctx.setLineDash([5,5]);ctx.stroke();ctx.setLineDash([]);
  }

  // Sweep
  sweep.v=(sweep.v+0.013)%(Math.PI*2);
  ctx.save();ctx.translate(cx,cy);ctx.rotate(sweep.v);
  const sw=ctx.createLinearGradient(0,0,Math.min(W,H)/2,0);
  sw.addColorStop(0,danger?"rgba(255,60,60,.28)":"rgba(50,220,130,.22)");
  sw.addColorStop(1,"rgba(0,0,0,0)");
  ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,Math.min(W,H)/2,-.65,0);ctx.closePath();
  ctx.fillStyle=sw;ctx.fill();ctx.restore();

  // Trains — plotted at real GPS positions relative to user
  trains.forEach(t=>{
    if(!t.lat||!t.lon)return;
    const dLat=(t.lat-u.lat)*111320;
    const dLon=(t.lon-u.lon)*111320*Math.cos(u.lat*Math.PI/180);
    let px=cx+dLon*scale,py=cy-dLat*scale;
    const dist=Math.sqrt((px-cx)**2+(py-cy)**2);
    const maxR=Math.min(W,H)/2-16;
    if(dist>maxR){px=cx+(px-cx)/dist*maxR;py=cy+(py-cy)/dist*maxR;}

    const col=LC[t.line]||"#888";
    const isA=t.distanceToUser<=S.alertDist||t.eta<=30;
    if(isA){
      const pr=13+Math.sin(Date.now()/280)*4;
      ctx.beginPath();ctx.arc(px,py,pr,0,Math.PI*2);
      ctx.fillStyle=col+"30";ctx.fill();
    }
    // Direction arrow
    if(t.bearing!=null){
      const hb=(t.bearing-90)*Math.PI/180;
      ctx.beginPath();ctx.moveTo(px,py);
      ctx.lineTo(px-Math.cos(hb)*20,py-Math.sin(hb)*20);
      ctx.strokeStyle=col+"88";ctx.lineWidth=2;ctx.stroke();
      const ax=px+Math.cos(hb)*12,ay=py+Math.sin(hb)*12;
      ctx.beginPath();ctx.moveTo(ax,ay);
      ctx.lineTo(ax-Math.cos(hb-.4)*7,ay-Math.sin(hb-.4)*7);
      ctx.lineTo(ax-Math.cos(hb+.4)*7,ay-Math.sin(hb+.4)*7);
      ctx.closePath();ctx.fillStyle=col+"cc";ctx.fill();
    }
    ctx.beginPath();ctx.arc(px,py,isA?10:8,0,Math.PI*2);
    ctx.fillStyle=col;ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.85)";ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=col==="#FCCC0A"?"#000":"#fff";
    ctx.font=`bold ${isA?10:9}px Nunito,sans-serif`;
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(t.line,px,py);
  });

  // User dot
  const up=5+Math.sin(Date.now()/500)*2;
  ctx.beginPath();ctx.arc(cx,cy,up*2.2,0,Math.PI*2);
  ctx.fillStyle=danger?"rgba(255,80,80,.2)":"rgba(79,172,254,.2)";ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,8,0,Math.PI*2);
  ctx.fillStyle=danger?"#ff5252":"#4facfe";ctx.fill();
  ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle="#fff";ctx.font="bold 8px Nunito,sans-serif";
  ctx.textAlign="center";ctx.textBaseline="top";ctx.fillText("YOU",cx,cy+10);

  rafId=requestAnimationFrame(drawRadar);
}
function startRadar(){
  cancelAnimationFrame(rafId);
  canvas.width=310;canvas.height=310;
  canvas.style.cssText="border-radius:50%;display:block;margin:0 auto;box-shadow:"+
    (S.danger?"0 0 50px rgba(255,60,60,.22)":"0 0 50px rgba(79,172,254,.18)");
  rafId=requestAnimationFrame(drawRadar);
}

/* ─── AI Guide ───────────────────────────────────────────────────────────── */
async function aiSend(text){
  if(!text||S.aiLoading)return;
  S.aiMessages.push({role:"user",content:text});
  S.aiLoading=true;render();
  const u=S.loc;
  const ctx=`You are the AI inside Track Watch, an urbex subway proximity alert app for NYC. Real-time context:
Location: ${u?`${u.lat.toFixed(5)}, ${u.lon.toFixed(5)} (±${Math.round(u.acc||0)}m)`:"NYC sim, no GPS"}
Alert zone: ${S.alertDist}m | ${S.alerts.length>0?S.alerts.length+" trains in zone":"Zone clear"}
Nearby trains: ${S.trains.slice(0,6).map(t=>`Line ${t.line} ${Math.round(t.distanceToUser)}m ${trainHeading(t)} ETA ${t.eta}s`).join(", ")||"none"}

You know the NYC subway deeply: all lines, tunnels, third rails, maintenance windows, station exits, schedules. You know urbex safety, gear, headlight detection, alcove spotting. Be direct and practical.`;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:ctx,
        messages:S.aiMessages.map(m=>({role:m.role,content:m.content}))})
    });
    const data=await res.json();
    const reply=data.content?.filter(b=>b.type==="text").map(b=>b.text).join("")||"No response.";
    S.aiMessages.push({role:"assistant",content:reply});
  }catch{S.aiMessages.push({role:"assistant",content:"Connection error."});}
  S.aiLoading=false;render();
  setTimeout(()=>{const b=el("ai-bottom");if(b)b.scrollIntoView({behavior:"smooth"});},50);
}

  content.appendChild(wrap);
}

/* ─── AI Tab ─────────────────────────────────────────────────────────────── */
function renderAITab(content,border){
  const QUICK=["Plan a route from my location to Times Square","Safest time to explore tonight?","Which lines have the longest gaps between trains?","Best gear for tunnel exploring?","How to spot a train headlight from far?","Emergency exits on the A/C/E line?"];
  const wrap=ce("div",{style:{display:"flex",flexDirection:"column",gap:"10px"}});

  // Context chips
  const chips=ce("div",{style:{display:"flex",gap:"6px",flexWrap:"wrap"}});
  [S.loc?`📍 ${S.loc.lat.toFixed(3)},${S.loc.lon.toFixed(3)}`:"📍 NYC sim",
   `🚆 ${S.trains.length} trains`,
   S.alerts.length>0?`⚠️ ${S.alerts.length} in zone`:"✅ Zone clear"
  ].forEach(c=>{
    chips.innerHTML+=`<div style="font-size:10px;font-weight:700;padding:4px 10px;border-radius:50px;background:rgba(255,255,255,.06);color:var(--muted);border:1px solid rgba(255,255,255,.1)">${c}</div>`;
  });
  wrap.appendChild(chips);

  // Chat window
  const chatBox=ce("div",{style:{background:"var(--surface)",border:`1px solid ${border}`,borderRadius:"20px",overflow:"hidden",display:"flex",flexDirection:"column"}});
  const msgs=ce("div",{style:{maxHeight:"300px",overflowY:"auto",padding:"14px 14px 8px",display:"flex",flexDirection:"column",gap:"10px"}});
  S.aiMessages.forEach(m=>{
    const row=ce("div",{style:{display:"flex",flexDirection:"column",alignItems:m.role==="user"?"flex-end":"flex-start"}});
    const bubble=ce("div",{style:{maxWidth:"88%",padding:"10px 13px",borderRadius:m.role==="user"?"18px 18px 4px 18px":"18px 18px 18px 4px",background:m.role==="user"?"linear-gradient(135deg,#4facfe,#00e0ff)":"rgba(255,255,255,.07)",color:"#fff",fontSize:"12.5px",lineHeight:"1.65",fontWeight:m.role==="user"?"600":"500",border:m.role==="assistant"?"1px solid rgba(255,255,255,.08)":"none",whiteSpace:"pre-wrap",wordBreak:"break-word"}});
    bubble.textContent=m.content;
    const lbl=ce("div",{style:{fontSize:"9px",color:"rgba(255,255,255,.2)",marginTop:"3px",padding:"0 4px"}});
    lbl.textContent=m.role==="assistant"?"🤖 AI Guide":"You";
    row.appendChild(bubble);row.appendChild(lbl);
    msgs.appendChild(row);
  });
  if(S.aiLoading){
    const ld=ce("div",{style:{display:"flex",alignItems:"flex-start"}});
    ld.innerHTML=`<div style="padding:12px 16px;border-radius:18px 18px 18px 4px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)"><div style="display:flex;gap:5px;align-items:center">${[0,1,2].map(i=>`<div style="width:7px;height:7px;border-radius:50%;background:rgba(79,172,254,.6);animation:blink 1.2s ${i*.2}s infinite"></div>`).join("")}</div></div>`;
    msgs.appendChild(ld);
  }
  const bottom=ce("div",{id:"ai-bottom"});
  msgs.appendChild(bottom);
  chatBox.appendChild(msgs);

  // Input row
  const inputRow=ce("div",{style:{padding:"8px 10px 10px",borderTop:"1px solid rgba(255,255,255,.07)",display:"flex",gap:"8px",alignItems:"flex-end"}});
  const ta=ce("textarea",{style:{flex:"1",minHeight:"40px",maxHeight:"80px",background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.1)",borderRadius:"14px",padding:"9px 12px",color:"#fff",fontSize:"12px",resize:"none",lineHeight:"1.5"}});
  ta.placeholder="Ask anything — routes, safety, gear…";
  ta.addEventListener("input",()=>{ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,80)+"px";});
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();aiSend(ta.value.trim());}});
  const sendBtn=ce("button",{class:"pill",style:{width:"40px",height:"40px",padding:"0",borderRadius:"50%",flexShrink:"0",background:"linear-gradient(135deg,#4facfe,#00e0ff)",color:"#fff",border:"none",fontSize:"16px",boxShadow:"0 4px 12px rgba(79,172,254,.4)"}},["↑"]);
  sendBtn.addEventListener("click",()=>aiSend(ta.value.trim()));
  inputRow.appendChild(ta);inputRow.appendChild(sendBtn);
  chatBox.appendChild(inputRow);
  wrap.appendChild(chatBox);

  // Quick prompts
  const qSection=ce("div",{style:{display:"flex",flexDirection:"column",gap:"6px"}});
  qSection.innerHTML=`<div class="label">QUICK QUESTIONS</div>`;
  QUICK.forEach(q=>{
    const btn=ce("button",{style:{textAlign:"left",padding:"10px 14px",borderRadius:"14px",background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)",color:"rgba(255,255,255,.55)",fontSize:"12px",fontFamily:"'Nunito',sans-serif",cursor:"pointer",fontWeight:"500",width:"100%",transition:"background .15s"}});
    btn.textContent=q;
    btn.addEventListener("mouseover",()=>btn.style.background="rgba(79,172,254,.08)");
    btn.addEventListener("mouseout",()=>btn.style.background="rgba(255,255,255,.04)");
    btn.addEventListener("click",()=>aiSend(q));
    qSection.appendChild(btn);
  });
  wrap.appendChild(qSection);
  content.appendChild(wrap);
  setTimeout(()=>{msgs.scrollTop=msgs.scrollHeight;},0);
}

/* ─── Crew Tab ───────────────────────────────────────────────────────────── */
function renderCrewTab(content,border){
  const wrap=ce("div",{style:{display:"flex",flexDirection:"column",gap:"10px"}});

  // Dead Man's Switch
  const dms=ce("div",{class:"card",style:{border:`1px solid ${S.dmsArmed?"rgba(255,82,82,.25)":border}`,display:"flex",flexDirection:"column",gap:"12px"}});
  const dmsHeader=ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}});
  dmsHeader.innerHTML=`<div><div style="font-size:13px;font-weight:800;color:${S.dmsArmed?"#ff7878":"#fff"}">☠️ Dead Man's Switch</div><div style="font-size:10px;color:var(--muted);margin-top:2px">Fires alert if you miss a check-in</div></div>`;
  const dmsBtn=ce("button",{class:"chip pill-sm",style:{background:S.dmsArmed?"rgba(255,82,82,.2)":"rgba(79,172,254,.15)",color:S.dmsArmed?"#ff7878":"#4facfe",border:`1px solid ${S.dmsArmed?"rgba(255,82,82,.35)":"rgba(79,172,254,.25)"}`}},[S.dmsArmed?"DISARM":"ARM"]);
  dmsBtn.addEventListener("click",()=>S.dmsArmed?disarmDMS():armDMS());
  dmsHeader.appendChild(dmsBtn);dms.appendChild(dmsHeader);

  if(S.dmsArmed){
    dms.innerHTML+=`
    <div id="dms-triggered" style="display:${S.dmsTriggered?"flex":"none"};padding:10px 14px;border-radius:14px;background:rgba(255,82,82,.15);border:1px solid rgba(255,82,82,.4);font-size:12px;font-weight:700;color:#ff8080;text-align:center;animation:redFlash .6s infinite">
      🚨 CHECK-IN OVERDUE — Are you OK?
    </div>
    <div style="text-align:center">
      <div id="dms-count" style="font-size:38px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums">${S.dmsCountdown}s</div>
      <div style="font-size:10px;color:var(--muted);margin-top:2px">until alert fires</div>
      <div id="dms-bar"><div id="dms-fill" style="width:${(S.dmsCountdown/S.dmsInterval*100)}%"></div></div>
    </div>`;
    const checkInBtn=ce("button",{class:"pill",style:{background:"linear-gradient(135deg,#43e97b,#38f9d7)",color:"#07200f",border:"none",boxShadow:"0 6px 20px rgba(67,233,123,.35)",fontSize:"14px",fontWeight:"800"}},["✓  I'M OK — CHECK IN"]);
    checkInBtn.addEventListener("click",dmsCheckIn);
    dms.appendChild(checkInBtn);
    const intDiv=ce("div");
    intDiv.innerHTML=`<div class="label">INTERVAL</div><div style="display:flex;gap:6px">`;
    const intRow=ce("div",{style:{display:"flex",gap:"6px"}});
    [15,30,60,120].forEach(s=>{
      const b=ce("button",{class:"chip",style:{flex:"1",padding:"7px 0",background:S.dmsInterval===s?"rgba(79,172,254,.2)":"rgba(255,255,255,.06)",color:S.dmsInterval===s?"#4facfe":"rgba(255,255,255,.4)",border:`1px solid ${S.dmsInterval===s?"rgba(79,172,254,.3)":"rgba(255,255,255,.08)"}`}},[s+"s"]);
      b.addEventListener("click",()=>{S.dmsInterval=s;S.dmsCountdown=s;render();});
      intRow.appendChild(b);
    });
    const intWrap=ce("div");
    intWrap.innerHTML=`<div class="label">INTERVAL</div>`;
    intWrap.appendChild(intRow);
    dms.appendChild(intWrap);
  } else {
    dms.innerHTML+=`<div style="font-size:11px;color:var(--muted);line-height:1.6">Arm to set a check-in timer. Miss a check-in and it fires vibration + alert. Essential for solo runs.</div>`;
  }
  wrap.appendChild(dms);

  // Crew members
  const crewCard=ce("div",{class:"card",style:{border:`1px solid ${border}`,display:"flex",flexDirection:"column",gap:"10px"}});
  crewCard.innerHTML=`<div class="label">ADD CREW MEMBER</div>`;
  const nameIn=ce("input");nameIn.placeholder="Name";nameIn.type="text";
  const phoneIn=ce("input");phoneIn.placeholder="Phone (optional)";phoneIn.type="tel";
  const addBtn=ce("button",{class:"pill",style:{background:"linear-gradient(135deg,#4facfe,#00e0ff)",color:"#fff",border:"none",fontSize:"13px"}},["Add to Crew"]);
  addBtn.addEventListener("click",()=>{
    if(!nameIn.value.trim())return;
    S.crew.push({id:Date.now(),name:nameIn.value.trim(),phone:phoneIn.value.trim()});
    nameIn.value="";phoneIn.value="";render();
  });
  crewCard.appendChild(nameIn);crewCard.appendChild(phoneIn);crewCard.appendChild(addBtn);

  if(S.crew.length>0){
    const allSafe=S.crew.every(m=>S.crewChecked[m.id]);
    crewCard.innerHTML+=`<div class="label" style="margin-top:4px">CREW STATUS <span style="color:${allSafe?"#43e97b":"#ffd700"}">${allSafe?"✅ ALL SAFE":`${Object.values(S.crewChecked).filter(Boolean).length}/${S.crew.length} in`}</span></div>`;
    S.crew.forEach(m=>{
      const ok=S.crewChecked[m.id];
      const row=ce("div",{class:"crew-row",style:{border:`1px solid ${ok?"rgba(67,233,123,.25)":"rgba(255,255,255,.08)"}`}});
      row.innerHTML=`
        <div style="width:32px;height:32px;border-radius:50%;background:${ok?"rgba(67,233,123,.2)":"rgba(255,255,255,.08)"};display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0">${ok?"✅":"👤"}</div>
        <div style="flex:1"><div style="font-size:13px;font-weight:700;color:${ok?"#43e97b":"#fff"}">${m.name}</div>${m.phone?`<div style="font-size:10px;color:var(--muted);margin-top:1px">${m.phone}</div>`:""}</div>`;
      const safeBtn=ce("button",{class:"chip pill-sm",style:{background:ok?"rgba(255,82,82,.15)":"rgba(67,233,123,.15)",color:ok?"#ff8080":"#43e97b",border:`1px solid ${ok?"rgba(255,82,82,.3)":"rgba(67,233,123,.3)"}`}},[ok?"UNCHECK":"SAFE"]);
      safeBtn.addEventListener("click",()=>{S.crewChecked[m.id]=!ok;render();});
      const delBtn=ce("button",{style:{background:"none",border:"none",color:"rgba(255,255,255,.2)",fontSize:"18px",cursor:"pointer"}},["×"]);
      delBtn.addEventListener("click",()=>{S.crew=S.crew.filter(x=>x.id!==m.id);delete S.crewChecked[m.id];render();});
      row.appendChild(safeBtn);row.appendChild(delBtn);
      crewCard.appendChild(row);
    });
  }
  wrap.appendChild(crewCard);
  content.appendChild(wrap);
}

/* ─── Notes Tab ──────────────────────────────────────────────────────────── */
function renderNotesTab(content,border){
  const TAGS={hazard:{icon:"⚠️",color:"#ff8080"},safe:{icon:"✅",color:"#43e97b"},info:{icon:"📌",color:"#4facfe"},exit:{icon:"🚪",color:"#ffd700"}};
  if(!S._noteTag)S._noteTag="hazard";
  const wrap=ce("div",{style:{display:"flex",flexDirection:"column",gap:"10px"}});

  const addCard=ce("div",{class:"card",style:{border:`1px solid ${border}`}});
  addCard.innerHTML=`<div class="label">ADD NOTE</div>`;
  const ta=ce("textarea",{style:{width:"100%",minHeight:"68px",marginBottom:"10px"}});
  ta.placeholder="e.g. 3rd rail exposed near pillar 42, safe alcove at 50m…";
  addCard.appendChild(ta);
  const tagRow=ce("div",{style:{display:"flex",gap:"8px",alignItems:"center"}});
  const tagBtns=ce("div",{style:{display:"flex",gap:"6px",flex:"1"}});
  Object.entries(TAGS).forEach(([k,v])=>{
    const b=ce("button",{class:"chip",style:{flex:"1",padding:"6px 0",fontSize:"14px",background:S._noteTag===k?`${v.color}22`:"rgba(255,255,255,.05)",color:S._noteTag===k?v.color:"rgba(255,255,255,.35)",border:`1px solid ${S._noteTag===k?v.color+"44":"rgba(255,255,255,.08)"}`}},[v.icon]);
    b.addEventListener("click",()=>{S._noteTag=k;renderNotesTab(content,border);});
    tagBtns.appendChild(b);
  });
  const saveBtn=ce("button",{class:"pill",style:{background:"linear-gradient(135deg,#4facfe,#00e0ff)",color:"#fff",border:"none",width:"auto",padding:"9px 18px",fontSize:"13px"}},["Save"]);
  saveBtn.addEventListener("click",()=>{
    if(!ta.value.trim())return;
    S.notes.unshift({id:Date.now(),text:ta.value.trim(),tag:S._noteTag,time:new Date().toLocaleString()});
    S.notes=S.notes.slice(0,50);
    try{localStorage.setItem("tw_notes",JSON.stringify(S.notes));}catch{}
    ta.value="";render();
  });
  tagRow.appendChild(tagBtns);tagRow.appendChild(saveBtn);
  addCard.appendChild(tagRow);
  wrap.appendChild(addCard);

  if(S.notes.length===0){
    wrap.innerHTML+=`<div class="card" style="text-align:center;padding:28px 0;border:1px solid rgba(255,255,255,.07)"><div style="font-size:28px;margin-bottom:8px">📓</div><div style="font-size:12px;color:var(--muted)">No notes yet — add hazards, exits, safe spots</div></div>`;
  } else {
    S.notes.forEach(n=>{
      const t=TAGS[n.tag]||TAGS.info;
      const card=ce("div",{class:"note-card",style:{border:`1px solid ${t.color+"33"}`}});
      card.innerHTML=`<div style="font-size:20px;margin-top:1px;flex-shrink:0">${t.icon}</div><div style="flex:1"><div style="font-size:12px;font-weight:600;color:#fff;line-height:1.5">${n.text}</div><div style="font-size:9px;color:rgba(255,255,255,.28);margin-top:4px">${n.time}</div></div>`;
      const del=ce("button",{style:{background:"none",border:"none",color:"rgba(255,255,255,.25)",fontSize:"18px",cursor:"pointer",padding:"0 4px",flex:"shrink:0"}},["×"]);
      del.addEventListener("click",()=>{S.notes=S.notes.filter(x=>x.id!==n.id);try{localStorage.setItem("tw_notes",JSON.stringify(S.notes));}catch{}render();});
      card.appendChild(del);
      wrap.appendChild(card);
    });
  }
  content.innerHTML="";content.appendChild(wrap);
}

/* ─── Windows Tab ────────────────────────────────────────────────────────── */
function renderWindowsTab(content,border){
  const now=new Date(),h=now.getHours();
  const isLow=h>=1&&h<5;
  const wrap=ce("div",{style:{display:"flex",flexDirection:"column",gap:"10px"}});
  wrap.innerHTML=`
  <div class="card" style="border:1px solid ${isLow?"rgba(67,233,123,.25)":"rgba(255,82,82,.25)"};background:${isLow?"rgba(67,233,123,.06)":"rgba(255,82,82,.06)"}">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="font-size:26px">${isLow?"🌙":"🚇"}</div>
      <div>
        <div style="font-weight:800;font-size:14px;color:${isLow?"#43e97b":"#ff7878"}">${isLow?"Lower Activity Window":"Active Service Hours"}</div>
        <div style="font-size:11px;color:rgba(255,255,255,.4);margin-top:2px">${now.toLocaleTimeString()} · ${isLow?"1–5 AM: reduced frequency across most lines":"Trains running full schedule"}</div>
      </div>
    </div>
  </div>
  ${[
    {line:"All lines",w:"1:00–5:00 AM",low:isLow,desc:"Reduced frequency, maintenance trains active"},
    {line:"1 2 3 4 5 6 7",w:"Late nights",low:h<22&&h>6,desc:"Local service only nights/weekends"},
    {line:"L",w:"1:30–5:30 AM",low:h>=2&&h<5,desc:"Frequent overnight maintenance"},
    {line:"A/C/E",w:"Overnight",low:false,desc:"A runs express overnight, C/E suspended"},
    {line:"N/Q/R/W",w:"After midnight",low:h>22||h<6,desc:"Reduced frequency after midnight"},
  ].map(w=>`
    <div class="card" style="border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px">
      <div style="font-size:16px;flex-shrink:0">${w.low?"🟢":"🟡"}</div>
      <div style="flex:1"><div style="font-size:12px;font-weight:700;color:#fff">${w.line}</div><div style="font-size:11px;color:var(--muted);margin-top:2px">${w.desc}</div></div>
      <div style="font-size:10px;font-weight:700;color:var(--muted);flex-shrink:0;text-align:right">${w.w}</div>
    </div>`).join("")}
  <div class="card" style="border:1px solid rgba(255,255,255,.06);text-align:center;font-size:11px;color:rgba(255,255,255,.3);line-height:1.7">⚠️ Maintenance trains run at any hour. Never rely on this for safety decisions.</div>`;
  content.appendChild(wrap);
}

/* ─── Settings Tab ───────────────────────────────────────────────────────── */
function renderSettingsTab(content,accent,border,isLive){
  const wrap=ce("div",{style:{display:"flex",flexDirection:"column",gap:"10px"}});

  // Data source
  const ds=ce("div",{class:"card",style:{border:`1px solid ${border}`}});
  ds.innerHTML=`<div class="label">DATA SOURCE</div>`;
  const dsRow=ce("div",{style:{display:"flex",gap:"8px"}});
  [["live","🔴 Live MTA"],["sim","⚡ Simulation"]].forEach(([m,label])=>{
    const active=S.liveMode===(m==="live");
    const b=ce("button",{class:"chip",style:{flex:"1",padding:"10px 0",background:active?accent+"22":"rgba(255,255,255,.06)",color:active?accent:"rgba(255,255,255,.4)",border:`1px solid ${active?border:"rgba(255,255,255,.08)"}`}},[label]);
    b.addEventListener("click",()=>{S.liveMode=m==="live";addLog(`→ ${m} mode`);render();});
    dsRow.appendChild(b);
  });
  ds.appendChild(dsRow);
  ds.innerHTML+=`<p style="font-size:10px;color:var(--muted);margin-top:10px;line-height:1.6">Live fetches real MTA feeds — no API key needed. Refreshes every 30s.</p>`;
  wrap.appendChild(ds);

  // Alert distance
  const ad=ce("div",{class:"card",style:{border:`1px solid ${border}`}});
  ad.innerHTML=`<div class="label">ALERT DISTANCE</div>`;
  const adRow=ce("div",{style:{display:"flex",gap:"7px"}});
  ADIST.forEach(d=>{
    const b=ce("button",{class:"chip",style:{flex:"1",background:S.alertDist===d?accent:"rgba(255,255,255,.06)",color:S.alertDist===d?"#fff":"rgba(255,255,255,.4)",boxShadow:S.alertDist===d?`0 3px 10px ${accent}44`:"none"}},[d+"m"]);
    b.addEventListener("click",()=>{S.alertDist=d;render();});
    adRow.appendChild(b);
  });
  ad.appendChild(adRow);wrap.appendChild(ad);

  // Alert ETA
  const at=ce("div",{class:"card",style:{border:`1px solid ${border}`}});
  at.innerHTML=`<div class="label">ALERT WHEN ETA ≤</div>`;
  const atRow=ce("div",{style:{display:"flex",gap:"7px"}});
  ATIME.forEach(t=>{
    const b=ce("button",{class:"chip",style:{flex:"1",background:S.alertTime===t?accent:"rgba(255,255,255,.06)",color:S.alertTime===t?"#fff":"rgba(255,255,255,.4)",boxShadow:S.alertTime===t?`0 3px 10px ${accent}44`:"none"}},[t+"s"]);
    b.addEventListener("click",()=>{S.alertTime=t;render();});
    atRow.appendChild(b);
  });
  at.appendChild(atRow);wrap.appendChild(at);

  // Notifications + GPS
  const ng=ce("div",{class:"card",style:{border:`1px solid ${border}`}});
  ng.innerHTML=`<div class="label">NOTIFICATIONS & GPS</div>`;
  const notifBtn=ce("button",{class:"pill",style:{background:S.notifOK?"rgba(67,233,123,.1)":"rgba(255,255,255,.06)",color:S.notifOK?"#43e97b":"rgba(255,255,255,.5)",border:`1px solid ${S.notifOK?"rgba(67,233,123,.28)":border}`,fontSize:"13px",marginBottom:"8px"}},[S.notifOK?"🔔  Notifications on":"🔕  Enable notifications"]);
  notifBtn.addEventListener("click",requestNotif);
  const gpsBtn=ce("button",{class:"pill",style:{background:"rgba(79,172,254,.08)",color:"#4facfe",border:"1px solid rgba(79,172,254,.22)",fontSize:"13px"}},[`📍  ${S.loc?`${S.loc.lat.toFixed(5)}, ${S.loc.lon.toFixed(5)}`:"Re-request GPS"}`]);
  gpsBtn.addEventListener("click",requestLocation);
  ng.appendChild(notifBtn);ng.appendChild(gpsBtn);wrap.appendChild(ng);

  // All lines
  const al=ce("div",{class:"card",style:{border:`1px solid ${border}`}});
  al.innerHTML=`<div class="label">ALL TRACKED LINES</div><div style="display:flex;flex-wrap:wrap;gap:6px">${ALL_LINES.map(l=>`<div style="width:28px;height:28px;border-radius:50%;background:${LC[l]||"#555"};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:${LC[l]==="#FCCC0A"?"#000":"#fff"}">${l}</div>`).join("")}</div>`;
  wrap.appendChild(al);

  // Legal
  const leg=ce("div",{class:"card",style:{border:"1px solid rgba(255,255,255,.06)",background:"rgba(255,255,255,.025)"}});
  leg.innerHTML=`<div class="label">LEGAL</div>`;
  const legBtn=ce("button",{class:"pill",style:{background:"rgba(255,255,255,.05)",color:"rgba(255,255,255,.35)",border:"1px solid rgba(255,255,255,.07)",fontSize:"12px"}},["📋  View Terms of Use & Liability Waiver"]);
  legBtn.addEventListener("click",()=>{S.screen="legal";S.legalScrolled=false;render();});
  leg.appendChild(legBtn);wrap.appendChild(leg);

  // Add to home screen tip
  wrap.innerHTML+=`<div class="card" style="border:1px solid rgba(79,172,254,.15);background:rgba(79,172,254,.06);text-align:center">
    <div style="font-size:13px;font-weight:700;color:#4facfe;margin-bottom:6px">📲 Add to Home Screen</div>
    <div style="font-size:11px;color:rgba(255,255,255,.5);line-height:1.7">Safari → Share → "Add to Home Screen"<br>Unlocks full GPS & notifications on iPhone</div>
  </div>`;

  wrap.innerHTML+=`<div style="text-align:center;font-size:10px;color:rgba(255,255,255,.15);line-height:1.7;padding:4px 2px">⚠️ For informational purposes only.<br>Trespassing on railway property is illegal and dangerous.</div>`;
  content.appendChild(wrap);
}

/* ─── Boot ───────────────────────────────────────────────────────────────── */
render();
</script>
